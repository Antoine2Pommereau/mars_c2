[project]
name = "mars_c2"
version = "0.1.0"
description = "MARS C2, surveillance maritime par fusion AIS et satellites"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "requests",
    "rasterio",
    "pyproj",
    "pyyaml",
    "psycopg[binary]",
    "fastapi",
    "uvicorn",
    "httpx",
    "pyshp",
    "shapely>=2",
    "pyarrow",
    "websockets",
    "asyncpg",
    "boto3",
]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mars", "mars.ais", "mars.fusion"]

# Lot Z2 : un test bloqué (verrou en base, réseau) échoue au bout de 60 s au lieu de geler toute la suite
# (un bloc de plus de 10 minutes vu une fois). pytest-timeout : pip install -e ".[test]"
[tool.pytest.ini_options]
timeout = 60

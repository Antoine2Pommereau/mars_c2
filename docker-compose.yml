services:
  db:
    image: postgis/postgis:16-3.4
    # L'image officielle PostGIS est publiée pour amd64 : Docker Desktop l'émule sur Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: mars
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: mars
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Lié à l'interface locale : la base n'est pas exposée sur le réseau
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d mars"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env          # identifiants Sentinel Hub
    environment:
      DATABASE_URL: postgresql://mars:mars@db:5432/mars
      # Service d'inférence lancé sur le Mac (GPU Apple) ; avec le profil "conteneur" : http://inference:8001
      INFERENCE_URL: ${INFERENCE_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Sonde de santé : l'API est prête quand /api/health répond, ce qui évite le « Connection reset »
    # lorsqu'un client l'interroge trop tôt après le démarrage.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Interface tactique (React), construite puis servie par nginx ; en développement : cd web && npm run dev
  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  # Variante en conteneur, sur CPU : docker compose --profile conteneur up -d
  inference:
    profiles: ["conteneur"]
    build:
      context: .
      dockerfile: inference/Dockerfile
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    ports:
      # Lié à l'interface locale : le service d'inférence n'est pas exposé sur le réseau
      - "127.0.0.1:8001:8001"

volumes:
  db_data:

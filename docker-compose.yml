services:
  db:
    image: postgis/postgis:16-3.4
    # L'image officielle PostGIS est publiée pour amd64 : Docker Desktop l'émule sur Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: mars
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: mars
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d mars"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Images du registre GitHub (paquets privés) : construites sur le Mac en linux/amd64, publiées sur ghcr.io, puis
  # téléchargées par le serveur (docs/deploiement.md). MARS_TAG choisit une version publiée (latest par défaut, ou
  # l'empreinte courte d'un commit pour revenir en arrière).
  backend:
    image: ghcr.io/antoine2pommereau/mars_c2-backend:${MARS_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env          # Sentinel Hub ; clés des travailleurs et seau des modèles (R2_MODELES_*), remis par l'API
    environment:
      DATABASE_URL: postgresql://mars:mars@db:5432/mars
      # Service d'inférence lancé sur le Mac (GPU Apple) ; avec le profil "conteneur" : http://inference:8001
      INFERENCE_URL: ${INFERENCE_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Interface tactique (React), construite puis servie par nginx ; en développement : cd web && npm run dev
  web:
    image: ghcr.io/antoine2pommereau/mars_c2-web:${MARS_TAG:-latest}
    build: ./web
    depends_on:
      - backend
    ports:
      - "8080:80"

  # AIS en direct : collecte AISStream vers l'archive Parquet (data/ais_live), puis ingestion en base.
  # Le Parquet reste l'archive complète ; la base reçoit des trajectoires allégées (config/rules.yaml, ingestion).
  collector:
    image: ghcr.io/antoine2pommereau/mars_c2-scripts:${MARS_TAG:-latest}   # une seule image pour collector, ingest et taches
    build:
      context: .
      dockerfile: scripts/Dockerfile
    command: ["python", "scripts/ais_live.py", "collect"]
    env_file: [.env, config/supervision.env]        # AISSTREAM_API_KEY ; seuils de la supervision
    environment:
      DATABASE_URL: postgresql://mars:mars@db:5432/mars   # redémarrages automatiques consignés dans task_runs
    volumes:
      - ./data/ais_live:/app/data/ais_live
    # Incident du 18/10/2026 (collecte figée, conteneur « Up ») : le contrôle de santé arrête une collecte sans fichier
    # écrit depuis SEUIL_COLLECTE_MIN minutes, et restart la relance ; init, pour que le signal atteigne Python
    # (scripts/sante.py)
    init: true
    healthcheck:
      test: ["CMD", "python", "scripts/sante.py", "collecte"]
      interval: 60s
      timeout: 40s
      retries: 1
      start_period: 120s
    restart: unless-stopped
    profiles: ["direct"]

  ingest:
    image: ghcr.io/antoine2pommereau/mars_c2-scripts:${MARS_TAG:-latest}
    build:
      context: .
      dockerfile: scripts/Dockerfile
    command: ["python", "scripts/ais_ingest.py"]
    env_file: config/supervision.env
    environment:
      DATABASE_URL: postgresql://mars:mars@db:5432/mars
    volumes:
      - ./data/ais_live:/app/data/ais_live:ro
      - ./data/listes:/app/data/listes:ro
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    # Boucle figée : arrêtée par le contrôle de santé, relancée par restart (une ingestion en échec, elle, reste en
    # vie, journalise, et l'alerte « ingestion en échec » prévient)
    init: true
    healthcheck:
      test: ["CMD", "python", "scripts/sante.py", "ingestion"]
      interval: 60s
      timeout: 40s
      retries: 1
      start_period: 300s
    restart: unless-stopped
    profiles: ["direct"]

  # Variante en conteneur, sur CPU : docker compose --profile conteneur up -d
  inference:
    profiles: ["conteneur"]
    build:
      context: .
      dockerfile: inference/Dockerfile
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    ports:
      - "8001:8001"

volumes:
  db_data:

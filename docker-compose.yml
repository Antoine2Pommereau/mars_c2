# Variables par service (lot Z1) : aucun conteneur ne reçoit le .env en entier. Chaque service reçoit seulement les
# variables qu'il lit, interpolées depuis le .env (${VAR:-} : vide si absente, sans avertissement). La clé Scaleway et
# la paire Copernicus du serveur ne vont qu'à taches (docker-compose.serveur.yml), MARS_OPERATEURS qu'à backend.
# tests/test_environnement.py confronte ces listes aux variables lues par le code de chaque service. Le .env reste
# un seul fichier (/opt/mars_c2/.env), qui sert aussi à l'interpolation.
x-base: &base
  DATABASE_URL: postgresql://mars:${POSTGRES_PASSWORD:-mars}@db:5432/mars
# Seau principal R2 (archives, sauvegardes, preuves images)
x-r2: &r2
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
# Seau des poids des modèles (adresses présignées remises aux travailleurs)
x-r2-modeles: &r2modeles
  R2_MODELES_BUCKET: ${R2_MODELES_BUCKET:-}
  R2_MODELES_ACCESS_KEY_ID: ${R2_MODELES_ACCESS_KEY_ID:-}
  R2_MODELES_SECRET_ACCESS_KEY: ${R2_MODELES_SECRET_ACCESS_KEY:-}
# Paire Copernicus dédiée aux travailleurs : remise par l'API sur le réseau privé, contrôlée par taches
x-cdse-travailleur: &cdsetravailleur
  CDSE_TRAVAILLEUR_ACCESS_KEY: ${CDSE_TRAVAILLEUR_ACCESS_KEY:-}
  CDSE_TRAVAILLEUR_SECRET_KEY: ${CDSE_TRAVAILLEUR_SECRET_KEY:-}
x-ntfy: &ntfy
  NTFY_SUJET: ${NTFY_SUJET:-}
  NTFY_URL: ${NTFY_URL:-https://ntfy.sh}

services:
  db:
    image: postgis/postgis:16-3.4
    # L'image officielle PostGIS est publiée pour amd64 : Docker Desktop l'émule sur Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: mars
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mars}   # ne change pas le mot de passe d'une base déjà créée (docs/exploitation.md)
    # Lot Z2 : statistiques des requêtes (extension créée par la migration 41) ; changer cette ligne redémarre la base
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"      # Mac : jamais sur le réseau local (le serveur n'en publie aucun)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d mars"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Images du registre GitHub (paquets privés) : construites sur le Mac en linux/amd64, publiées sur ghcr.io, puis
  # téléchargées par le serveur (docs/deploiement.md). MARS_TAG choisit une version publiée (latest par défaut, ou
  # l'empreinte courte d'un commit pour revenir en arrière).
  backend:
    image: ghcr.io/antoine2pommereau/mars_c2-backend:${MARS_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: [*base, *r2, *r2modeles, *cdsetravailleur, *ntfy]
      # Service d'inférence lancé sur le Mac (GPU Apple) ; avec le profil "conteneur" : http://inference:8001
      INFERENCE_URL: ${INFERENCE_URL:-http://host.docker.internal:8001}
      SH_CLIENT_ID: ${SH_CLIENT_ID:-}                 # Sentinel Hub : passages de la chaîne radar du Mac
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET:-}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}           # remis une fois aux travailleurs VIIRS, par le réseau privé
      MARS_OPERATEURS: ${MARS_OPERATEURS:-}           # empreintes des mots de passe des opérateurs : ici seulement
      MARS_GRAFANA_URL: ${MARS_GRAFANA_URL:-}
      PHOTOS: ${PHOTOS:-vesselfinder}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"      # Mac : API sur la machine seulement

  # Interface tactique (React), construite puis servie par nginx ; en développement : cd web && npm run dev
  web:
    image: ghcr.io/antoine2pommereau/mars_c2-web:${MARS_TAG:-latest}
    build: ./web
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

  # AIS en direct : collecte AISStream vers l'archive Parquet (data/ais_live), puis ingestion en base.
  # Le Parquet reste l'archive complète ; la base reçoit des trajectoires allégées (config/rules.yaml, ingestion).
  collector:
    image: ghcr.io/antoine2pommereau/mars_c2-scripts:${MARS_TAG:-latest}   # une seule image pour collector, ingest et taches
    build:
      context: .
      dockerfile: scripts/Dockerfile
    command: ["python", "scripts/ais_live.py", "collect"]
    env_file: config/supervision.env                  # seuils de la supervision (fichier versionné, sans secret)
    environment:
      <<: *base                                       # redémarrages automatiques consignés dans task_runs
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
    volumes:
      - ./data/ais_live:/app/data/ais_live
    # Incident du 18/10/2026 (collecte figée, conteneur « Up ») : le contrôle de santé arrête une collecte sans fichier
    # écrit depuis SEUIL_COLLECTE_MIN minutes, et restart la relance ; init, pour que le signal atteigne Python
    # (scripts/sante.py)
    init: true
    healthcheck:
      test: ["CMD", "python", "scripts/sante.py", "collecte"]
      interval: 60s
      timeout: 40s
      retries: 1
      start_period: 120s
    restart: unless-stopped
    profiles: ["direct"]

  ingest:
    image: ghcr.io/antoine2pommereau/mars_c2-scripts:${MARS_TAG:-latest}
    build:
      context: .
      dockerfile: scripts/Dockerfile
    command: ["python", "scripts/ais_ingest.py"]
    env_file: config/supervision.env
    environment:
      <<: *base
    volumes:
      - ./data/ais_live:/app/data/ais_live:ro
      - ./data/listes:/app/data/listes:ro
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    # Boucle figée : arrêtée par le contrôle de santé, relancée par restart (une ingestion en échec, elle, reste en
    # vie, journalise, et l'alerte « ingestion en échec » prévient)
    init: true
    healthcheck:
      test: ["CMD", "python", "scripts/sante.py", "ingestion"]
      interval: 60s
      timeout: 40s
      retries: 1
      start_period: 300s
    restart: unless-stopped
    profiles: ["direct"]

  # Variante en conteneur, sur CPU : docker compose --profile conteneur up -d
  inference:
    profiles: ["conteneur"]
    build:
      context: .
      dockerfile: inference/Dockerfile
    environment:
      SH_CLIENT_ID: ${SH_CLIENT_ID:-}
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET:-}
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  db_data:

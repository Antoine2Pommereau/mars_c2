services:
  db:
    image: postgis/postgis:16-3.4
    # L'image officielle PostGIS est publiée pour amd64 : Docker Desktop l'émule sur Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: mars
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: mars
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d mars"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://mars:mars@db:5432/mars
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:

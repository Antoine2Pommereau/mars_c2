services:
  db:
    image: postgis/postgis:16-3.4
    # L'image officielle PostGIS est publiée pour amd64 : Docker Desktop l'émule sur Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: mars
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: mars
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d mars"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Noms d'images explicites : construites sur le Mac en linux/amd64, envoyées au serveur par docker save et docker
  # load, puis démarrées avec docker compose up -d --no-build (docs/deploiement.md). Sans nom fixe, le nom dépendrait
  # du dossier du projet.
  backend:
    image: mars_c2-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env          # identifiants Sentinel Hub
    environment:
      DATABASE_URL: postgresql://mars:mars@db:5432/mars
      # Service d'inférence lancé sur le Mac (GPU Apple) ; avec le profil "conteneur" : http://inference:8001
      INFERENCE_URL: ${INFERENCE_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Interface tactique (React), construite puis servie par nginx ; en développement : cd web && npm run dev
  web:
    image: mars_c2-web
    build: ./web
    depends_on:
      - backend
    ports:
      - "8080:80"

  # AIS en direct : collecte AISStream vers l'archive Parquet (data/ais_live), puis ingestion en base.
  # Le Parquet reste l'archive complète ; la base reçoit des trajectoires allégées (config/rules.yaml, ingestion).
  collector:
    image: mars_c2-scripts          # une seule image pour collector, ingest et taches
    build:
      context: .
      dockerfile: scripts/Dockerfile
    command: ["python", "scripts/ais_live.py", "collect"]
    env_file: .env          # AISSTREAM_API_KEY
    volumes:
      - ./data/ais_live:/app/data/ais_live
    restart: unless-stopped
    profiles: ["direct"]

  ingest:
    image: mars_c2-scripts
    build:
      context: .
      dockerfile: scripts/Dockerfile
    command: ["python", "scripts/ais_ingest.py"]
    environment:
      DATABASE_URL: postgresql://mars:mars@db:5432/mars
    volumes:
      - ./data/ais_live:/app/data/ais_live:ro
      - ./data/listes:/app/data/listes:ro
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["direct"]

  # Variante en conteneur, sur CPU : docker compose --profile conteneur up -d
  inference:
    profiles: ["conteneur"]
    build:
      context: .
      dockerfile: inference/Dockerfile
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    ports:
      - "8001:8001"

volumes:
  db_data:

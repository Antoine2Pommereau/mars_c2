server {
    listen 80;

    # Résolution dynamique du nom "backend" : nginx retrouve l'API même après sa reconstruction
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    # Flux SSE : pas de mise en mémoire tampon, connexion longue
    location /api/stream {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_read_timeout 5m;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

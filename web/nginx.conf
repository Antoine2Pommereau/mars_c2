server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/stream {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_read_timeout 30m;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

# Retour des travailleurs éphémères (étape 3) : publié seulement sur l'adresse du réseau privé Scaleway
# (MARS_IP_PRIVEE, docker-compose.serveur.yml). Seules les routes de retour passent, protégées par un jeton.
server {
    listen 8090;
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    client_max_body_size 20m;

    location ~ ^/api/travailleurs/[0-9]+/(etat|resultats)$ {
        limit_except POST { deny all; }
        proxy_pass $backend;
        proxy_read_timeout 2m;
    }

    location / {
        return 404;
    }
}

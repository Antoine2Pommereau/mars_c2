# Lot Z1 : l'interface ne répond qu'aux noms du tunnel SSH (localhost, 127.0.0.1) et à son nom dans le réseau Docker
# (web, introuvable hors de ce réseau) ; tout autre en tête Host est fermé sans réponse, ce qui coupe le rebond DNS (une
# page d'un autre site qui ferait résoudre son nom vers 127.0.0.1).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# En têtes de sécurité, ajoutés à toute réponse de l'interface et de l'API. Politique de contenu compatible avec
# MapLibre (fond de carte et tuiles de CARTO, polices de Google, travailleurs en blob:) et avec les vignettes (data:,
# blob:, images servies par l'API) ; aucun script hors du site, aucune intégration dans un cadre.
map $uri $mars_csp {
    default "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://*.cartocdn.com; img-src 'self' data: blob: https://*.cartocdn.com; connect-src 'self' https://*.cartocdn.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name localhost 127.0.0.1 web;
    server_tokens off;
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    add_header Content-Security-Policy $mars_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Hôte d'origine transmis à l'API (lot A, 21/10/2026) : proxy_pass sur une variable envoie sinon « backend:8000 »
    # comme Host, et l'API, qui compare l'en tête Origin du navigateur (localhost:8080 par le tunnel) à cet hôte avant
    # toute écriture du panneau de contrôle, refusait la connexion des opérateurs (« Origine refusée »).
    location /api/stream {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;           # voir plus haut : l'origine des écritures est vérifiée
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;    # adresse du navigateur, écrase toute valeur reçue (compteur des connexions)
        proxy_read_timeout 30m;
    }

    # Spans de l'interface (requêtes vers l'API seulement, aucune donnée de la carte), relayés au collecteur
    # OpenTelemetry (étape D2). Sans collecteur (Mac), nginx répond 502 et l'interface abandonne l'envoi.
    location = /otel/v1/traces {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        set $otel http://otel:4318;
        proxy_pass $otel/v1/traces;
        proxy_read_timeout 10s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

# Retour des travailleurs éphémères (étape 3) : publié seulement sur l'adresse du réseau privé Scaleway
# (MARS_IP_PRIVEE, docker-compose.serveur.yml). Seules les routes de retour passent, protégées par un jeton.
server {
    listen 8090;
    server_tokens off;
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    client_max_body_size 20m;

    location ~ ^/api/travailleurs/[0-9]+/(etat|resultats|journal)$ {
        limit_except POST { deny all; }
        proxy_pass $backend;
        proxy_read_timeout 2m;
    }

    # Spans d'un travailleur (étape D2) : le jeton de l'exécution est vérifié par l'API (auth_request, refusé dès
    # que l'instance est détruite), puis le lot est relayé au collecteur OpenTelemetry, sans le jeton. Le collecteur
    # n'écoute jamais sur l'adresse privée : un seul port privé, un seul secret, celui des résultats.
    location ~ ^/api/travailleurs/([0-9]+)/traces$ {
        limit_except POST { deny all; }
        set $travailleur $1;
        auth_request /_jeton_travailleur;
        client_max_body_size 4m;
        set $otel http://otel:4318;
        proxy_set_header Authorization "";
        proxy_pass $otel/v1/traces;
        proxy_read_timeout 30s;
    }

    location = /_jeton_travailleur {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass $backend/api/travailleurs/$travailleur/otel;
    }

    location / {
        return 404;
    }
}

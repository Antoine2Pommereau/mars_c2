server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/stream {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_read_timeout 30m;
    }

    # Spans de l'interface (requêtes vers l'API seulement, aucune donnée de la carte), relayés au collecteur
    # OpenTelemetry (étape D2). Sans collecteur (Mac), nginx répond 502 et l'interface abandonne l'envoi.
    location = /otel/v1/traces {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        set $otel http://otel:4318;
        proxy_pass $otel/v1/traces;
        proxy_read_timeout 10s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

# Retour des travailleurs éphémères (étape 3) : publié seulement sur l'adresse du réseau privé Scaleway
# (MARS_IP_PRIVEE, docker-compose.serveur.yml). Seules les routes de retour passent, protégées par un jeton.
server {
    listen 8090;
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    client_max_body_size 20m;

    location ~ ^/api/travailleurs/[0-9]+/(etat|resultats|journal)$ {
        limit_except POST { deny all; }
        proxy_pass $backend;
        proxy_read_timeout 2m;
    }

    # Spans d'un travailleur (étape D2) : le jeton de l'exécution est vérifié par l'API (auth_request, refusé dès
    # que l'instance est détruite), puis le lot est relayé au collecteur OpenTelemetry, sans le jeton. Le collecteur
    # n'écoute jamais sur l'adresse privée : un seul port privé, un seul secret, celui des résultats.
    location ~ ^/api/travailleurs/([0-9]+)/traces$ {
        limit_except POST { deny all; }
        set $travailleur $1;
        auth_request /_jeton_travailleur;
        client_max_body_size 4m;
        set $otel http://otel:4318;
        proxy_set_header Authorization "";
        proxy_pass $otel/v1/traces;
        proxy_read_timeout 30s;
    }

    location = /_jeton_travailleur {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass $backend/api/travailleurs/$travailleur/otel;
    }

    location / {
        return 404;
    }
}

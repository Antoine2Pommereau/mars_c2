# Règles de MARS C2. Toute alerte enregistre la version ci dessous.
version: "2026.10.27"

model:
  file: models/xview3_membre4_v2s.jit
  version: "xview3_v2s_membre4, sigma0 bilineaire"
  # Seuil de présence abaissé de 0,30 (valeur de l'auteur, calibrée sur xView3) à 0,20 : sur nos scènes le modèle
  # est moins confiant, et le filtre de contraste local confirme les candidats (balayage du 2 octobre 2026)
  thresholds:
    objectness: 0.20
    vessel: 0.338
    fishing: 0.35
  merge:                 # fusion des pics multiples d'un même grand écho
    radius_m: 150
    length_factor: 0.6

contrast:
  min_vv_db: 10.0        # en dessous : détection conservée, masquée pour contraste faible
  peak_half_px: 2
  ring_inner_px: 10
  ring_outer_px: 40

masks:
  land_buffer_m: 500     # une détection à moins de 500 m de la terre est masquée

fusion:
  ais_window_min: 15     # positions AIS lues autour de t0
  max_gap_min: 10        # interpolation ou estime au plus 10 minutes
  base_radius_m: 300
  doppler_s: 150         # décalage le long de la trace = doppler_s x vitesse vers le radar (m/s) ; phase 0 : jusqu'à 730 m
  # Direction de vol de Sentinel 1 à ces latitudes, selon le sens de l'orbite : la tolérance est une ellipse
  # allongée le long de la trace
  flight_heading_deg:
    ascending: 348
    descending: 192

persistence:
  radius_m: 60           # un écho sans AIS revu à moins de 60 m, à une autre date, est un écho fixe
  min_days_apart: 1

unconfirmed:
  min_length_m: 50       # seuls les grands navires sont presque toujours vus par le radar
  tolerance_factor: 1.5  # tolérance élargie : on ne cherche qu'un écho compatible, même écarté par un filtre
  high_length_m: 150     # sévérité moyenne au delà de 150 m, faible sinon

dark_ship:
  critical_length_m: 50
  critical_contrast_db: 20

rendezvous:
  max_distance_m: 500
  alongside_m: 50        # bord à bord : transfert physiquement possible
  # Statuts déclarés excluant une tranche. Vide : un navire « amarré » à plus de 5 km des côtes est un indice
  # (amarré à l'autre navire), pas une excuse ; exclure ce statut effaçait les transbordements bord à bord.
  excluded_nav_status: []
  max_speed_kn: 2.0
  min_duration_min: 120
  slot_min: 10           # positions regroupées par tranches de 10 minutes
  max_gap_min: 20        # deux tranches séparées de 20 minutes au plus restent dans le même épisode
  min_coast_km: 3        # en dessous : abords de côte et de port, exclus
  # Optimisation, pas un seuil : positions à moins de 1 km de la terre écartées avant l'appariement. Marge de 2 km
  # sous min_coast_km pour qu'un épisode retenu (milieu à plus de 3 km) ne perde aucune de ses tranches.
  coast_prefilter_m: 1000
  stationary_zone_buffer_m: 1000   # dans une zone de mouillage : alerte conservée, sévérité faible
  high_duration_min: 240 # sévérité élevée au delà de 4 heures, de 20 km des côtes, ou bord à bord
  high_coast_km: 20
  excluded_ship_types: [Tug, Towing, "Towing long/wide", Pilot, SAR, "Law enforcement", "Port tender",
                        Dredging, Diving, Military, Medical, "Anti-pollution"]

stationary_zones:
  cell_deg_lon: 0.04     # environ 2,4 km à ces latitudes : capte les mouillages dispersés
  cell_deg_lat: 0.02     # environ 2,2 km
  max_speed_kn: 0.5
  min_vessels: 4         # au moins 4 navires distincts immobiles dans la même cellule
  min_slow_positions: 30

reception:
  # La fiabilité se mesure par la continuité des trajectoires, pas par la densité du trafic : dans une cellule
  # bien couverte, deux messages successifs d'un navire de classe A en route sont presque toujours rapprochés.
  cell_deg_lon: 0.10     # environ 6 km
  cell_deg_lat: 0.05     # environ 5,5 km
  # PROVISOIRE (11/10/2026), en attendant la recalibration complète sur dix jours de collecte. Les valeurs danoises
  # (180 s, 95 %, 200 paires) laissaient la zone vide sur les quatre jours mesurés du 06 au 09/10 : le flux AISStream
  # est partiel et les positions sont allégées à un point par minute en route. Avec 600 s, 90 % et 50 paires, la zone
  # couvrait 1 067 cellules, environ 44 000 km² (rapport de mesures, section 2).
  max_interval_s: 600    # intervalle jugé normal entre deux messages d'un navire en route (provisoire)
  min_coverage: 0.90     # au moins 90 % des intervalles sous ce seuil (provisoire)
  min_pairs: 50          # assez d'observations pour juger (provisoire)
  min_vessels: 3         # navires distincts au moins

ais_gap:
  # observation : épisodes détectés comptés et journalisés dans task_runs (tâche regles), sans alerte ; alertes :
  # alertes AIS_GAP. En observation tant que les seuils ci dessous (messages avant la coupure, durée, projection) sont
  # ceux du Danemark : ils alimentent la recalibration sans remplir le fil.
  mode: observation
  min_gap_min: 120       # silence d'au moins deux heures
  min_speed_kn: 1.0      # le navire faisait route au moment de se taire
  min_prior_messages: 10 # et émettait régulièrement : au moins 10 messages dans l'heure précédente
  prior_window_min: 60   # (écarte les MMSI fantômes : un message isolé, souvent un identifiant corrompu)
  min_coast_km: 3        # dernière position au large
  edge_margin_deg: 0.25  # loin du bord des données chargées (environ 15 km en longitude, 28 km en latitude)
  ais_classes: [A]       # classe B (petites unités) ignorée : émission moins fréquente, coupures courantes
  partner_radius_m: 500  # navires lents à moins de 500 m de la dernière position ou de la réapparition
  partner_min_slow_min: 30      # et restés lents au moins 30 minutes (un navire qui croise ne compte pas)
  partner_window_max_min: 180   # recherche limitée aux 3 premières heures du silence
  projection_min: 120    # position estimée 2 h après le dernier message (route et vitesse déclarées) : si elle sort
                         # de la zone fiable ou des données, le silence est une sortie de couverture. Porté de 30 à
                         # 120 min : le 17 juin, PEARL SEAWAYS parti vers Oslo et revenu 17 h plus tard passait le filtre
  # Route déclarée (dernier cap, dernière vitesse) suivie sur 60 min, un point toutes les 10 min : si elle quitte la
  # zone fiable, le silence est une sortie de couverture, même quand la disparition a lieu dans la zone (11/10/2026 :
  # en Manche, à 40 km au sud de l'île de Wight, les navires de la voie ouest cessent d'être reçus)
  route_horizon_min: 60
  route_pas_min: 10
  # Point de disparition collectif : au moins 3 navires sans lien qui se taisent le même jour dans la même maille
  # (0,2 × 0,1 degré, environ 14 × 11 km) signalent une limite de réception : leurs coupures sont déclassées (faible)
  # Un silence qui commence dans un trou de notre collecte, ou dans les 10 minutes qui le précèdent, a un début
  # inconnu (le navire a pu émettre pendant le trou) : écarté et compté à part (12/10/2026)
  debut_incertain_min: 10
  disparition_min_navires: 3
  disparition_cellule_deg: [0.2, 0.1]
  projection_open_min: 120   # sans réapparition, horizon porté à la durée minimale du silence : un navire qui
                             # aurait quitté la zone dans ce délai en gardant sa route n'apporte aucune preuve
  stop_ratio: 0.3        # vitesse implicite < 30 % de la vitesse déclarée : arrêt pendant le silence
  stop_min_speed_kn: 5   # seulement pour un navire qui faisait vraiment route : sous 5 nœuds (pêche, dérive),
                         # un déplacement faible pendant le silence n'a rien d'anormal
  continue_ratio: 0.5    # vitesse implicite > 50 % : route poursuivie, silence moins suspect
  partner_max_speed_kn: 2.0
  partner_min_positions: 5
  high_duration_min: 360 # silence sans réapparition : sévérité élevée au delà de 6 heures
  excluded_ship_types: [Tug, Towing, "Towing long/wide", Pilot, SAR, "Law enforcement", "Port tender",
                        Dredging, Diving, Military, Medical, "Anti-pollution"]

ingestion:
  # AIS en direct chargé en base (scripts/ais_ingest.py) ; l'archive Parquet garde tous les messages.
  # La base reçoit un point par minute en route et un toutes les dix minutes à l'arrêt, plus un point à chaque
  # bascule entre route et arrêt et à chaque changement de statut de navigation. Compatible avec les règles :
  # coupure AIS (10 messages dans l'heure, navire en route), réception (intervalles sous 180 s), rendez vous
  # (tranches de 10 minutes).
  moving_interval_s: 60
  stopped_interval_s: 600
  stopped_speed_kn: 0.5    # arrêté sous 0,5 nœud
  moving_speed_kn: 1.0     # en route au delà de 1 nœud ; entre les deux, l'état précédent est conservé

# Évaluation continue (conteneur taches, scripts/taches.py). Paramètres de fonctionnement, pas de calibration.
continu:
  intervalle_min: 5        # un cycle toutes les 5 minutes
  fenetre_h: 24            # fenêtre glissante des rendez vous, coupures AIS et listes de surveillance
  identite_fenetre_h: 72   # identités apparues depuis 3 jours
  # Coupure du flux : minute où l'ensemble des zones reçoit moins de 20 % de la médiane des positions par minute de
  # la fenêtre. Ces minutes ne comptent pas dans la durée d'un silence : une interruption d'AISStream ou de la
  # collecte ne fait pas apparaître une coupure AIS sur chaque navire.
  flux_min_ratio: 0.2

watchlist:
  # Niveaux signalés ; « autre risque » (immobilisations, avertissements) est trop bruyant
  niveaux: [fort, sanctionne, flotte_fantome, suspect_gur]
  passage_gap_h: 12        # sans position pendant 12 h : le passage suivant est une nouvelle alerte
  sejour_prolonge_h: 24    # passage de plus de 24 h : séjour prolongé signalé (durée, part à l'arrêt, lieu)
  arret_kn: 1.0            # à l'arrêt sous 1 nœud

identite:
  # Un nouveau nom n'est signalé qu'après 6 h sans retour à un nom antérieur : les alternances (deux émetteurs,
  # comme MUTIN et FS MUTIN) ne sont jamais signalées
  confirmation_min: 360
  # MMSI écartés en plus des MMSI génériques (code pays suivi de six zéros, comme 227000000, Marine nationale)
  mmsi_ignores: []
  # Bâtiments militaires : gravité minimale et étiquette « militaire » (un navire des listes garde sa gravité).
  # Indices : type AIS 35, MMSI ci dessous, premier mot du nom parmi ces préfixes, ou nom réduit à un numéro de coque.
  militaire:
    mmsi: [232002833]    # HMS CATTISTOCK (émettait « 101 »)
    # Préfixes sans ambiguïté avec un nom civil (LE, LÉ, HS ou SAS en sont exclus)
    prefixes_nom: [HMS, HMCS, HMAS, HMNZS, FS, USS, USNS, HNLMS, ZRMS, FGS, HDMS, KNM, HSWMS, ITS, ESPS, NRP, BNS,
                   ORP, TCG, ROKS, INS]

# Détections nocturnes VIIRS (étape 3, lot B ; mars/viirs.py). Valeurs de départ, à calibrer sur les premières nuits.
viirs:
  produits:                # bande Day/Night et géolocalisation, temps quasi réel puis produits standard (rattrapage)
    SNPP: [VNP02DNB, VNP03DNB]
    NOAA20: [VJ102DNB, VJ103DNB]
    NOAA21: [VJ202DNB, VJ203DNB]
  nuit_debut_h: 18         # une nuit va de 18 h à 6 h UTC (passages sur nos régions vers 0 h à 3 h 30) ;
  nuit_fin_h: 6            # elle porte la date de son début
  rattrapage_nuits: 3      # nuits relues à chaque passage : une nuit manquée est rattrapée
  # Appariement à l'AIS : pixel de 750 m, géolocalisation à environ un pixel près ; position AIS interpolée (ou
  # estimée sur 20 minutes au plus) à l'instant de la détection, plus une marge pour l'incertitude de l'estime
  tolerance_m: 1500
  estime_max_min: 20
  estime_marge_ratio: 0.5  # marge de plus : la moitié du chemin parcouru pendant l'estime
  cote_km: 5               # détection à moins de 5 km de la terre : écartée (ports, côtes éclairées)
  persistance_m: 1000      # lumière revue à moins de 1 km au moins 3 nuits distinctes sur 30 jours : lumière fixe
  persistance_nuits: 3
  persistance_jours: 30
  corridor_m: 3704         # à moins de 2 milles d'une infrastructure : gravité élevée
  liste_rayon_km: 10       # navire des listes à moins de 10 km (30 min près) : gravité élevée ; les deux : critique
  # Sans AIS ailleurs : gravité faible, « à confirmer » (AIS incomplet, petite pêche sans obligation d'AIS) ; moyenne
  # au delà de 12 milles des côtes (22 km, limite des eaux territoriales : la petite pêche côtière reste en deçà)
  tres_au_large_km: 22
  # Non évaluable (aucune alerte) : coupure du flux AIS à l'heure du passage (minutes sous continu.flux_min_ratio de
  # la médiane, à 5 minutes près), ou aucune réception AIS autour : hors zone de réception fiable quand elle est
  # construite, sinon aucun navire AIS reçu à moins de 30 km dans les 30 minutes autour du passage. Mesure des trois
  # premières nuits : 68 des 87 détections sans AIS n'avaient aucun navire AIS à moins de 20 km
  coupure_marge_min: 5
  couverture_rayon_km: 30
  couverture_fenetre_min: 30
  couverture_min_navires: 1

# Sentinel 1 (étape 3, lot C, mars/sentinel.py) : analyse d'un passage par un travailleur GPU
sentinel:
  # Sélection sobre : un passage Sentinel 1 (mode IW) n'est analysé que s'il couvre un corridor d'infrastructure où se
  # trouvait un navire des listes, ou une alerte DARK_SHIP de source VIIRS ouverte de gravité moyenne au moins
  corridor_m: 3704              # 2 milles autour d'une infrastructure
  liste_fenetre_min: 30         # navire des listes vu dans le corridor à 30 minutes près de l'acquisition
  viirs_gravite_min: moyenne
  viirs_fenetre_h: 24           # alerte VIIRS de moins de 24 heures avant le passage
  interet_rayon_m: 10000        # une scène est retenue si elle couvre un point d'intérêt à 10 km près
  passages_recents_h: 36        # passages examinés : acquis depuis moins de 36 heures
  attente_publication_h: 12     # scène pas encore au catalogue : nouvel essai au cycle suivant, jusqu'à 12 heures
  intervalle_min: 30            # examen des passages toutes les 30 minutes
  # Garde fous : au delà, refus clair consigné dans task_runs (tâche sentinel)
  # 0 : Sentinel arrêté (12/10/2026) tant que `taches.py sentinel-diagnostic` n'est pas entièrement au vert ; puis 2.
  # À 0, ni la sélection automatique ni la commande manuelle ne lancent rien (refus clair, sans appel à Scaleway).
  scenes_max_par_jour: 0
  budget_mensuel_eur: 6.0
  # Coût estimé avant lancement (refus si le budget du mois serait dépassé) : démarrage, pilotes et image d'analyse
  # (5 Go), puis téléchargement et analyse par scène (307 s sur un T4 selon AI2 ; L4 au moins aussi rapide)
  minutes_fixes: 12
  minutes_par_scene: 6          # scène entière (analyse manuelle d'un passage sans point d'intérêt)
  # Lot C3 : analyse limitée aux fenêtres utiles. Autour de chaque point d'intérêt, un carré de 2 × (interet_rayon_m
  # + fenetre_marge_m) de côté ; les carrés qui se chevauchent sont réunis. Le travailleur ne lit que ces fenêtres
  # dans les images COG (requêtes partielles) ; les détections à moins de fenetre_marge_m du bord d'une fenêtre sont
  # écartées (la chaîne d'AI2 garde les objets coupés au bord de l'image). Côté minimal : la chaîne découpe en
  # carreaux de 2 048 pixels Web Mercator (environ 14 km au sud de nos régions) et se trompe sur une image plus petite.
  fenetre_marge_m: 2000
  fenetre_cote_min_m: 16000
  minutes_par_fenetre_gpu: 2    # lecture partielle et analyse d'une fenêtre de 24 km sur GPU (estimation)
  minutes_fixes_cpu: 10         # démarrage d'une instance CPU, Docker, image d'analyse (5 Go)
  minutes_par_fenetre_cpu: 12   # analyse d'une fenêtre sur 8 processeurs (mesure en émulation, borne haute)
  # Rupture de stock des GPU (essai du 16/10/2026 : 412 out_of_stock au démarrage d'un L4-1-24G) : l'analyse attend en
  # « attente_gpu » et un nouvel essai a lieu à chaque cycle (intervalle_min), tant que la scène reste utile
  fenetre_utile_h: 24           # après l'acquisition ; au delà, analyse abandonnée et alerte ntfy
  repli_cpu_apres_h: 3          # sans GPU de la liste au bout de 3 h d'attente : fenêtres analysées sur processeur
  # Modèle d'AI2 (paramètres de sa chaîne)
  confiance: 0.9
  nms_m: 10
  # Vignette radar : environ 3 km de côté autour de la détection, VV en décibels
  vignette_km: 3
  # Contraste local mesuré par le travailleur sur l'image VV d'origine (intensité, pic sur 5 × 5 pixels contre la
  # médiane d'un anneau de 10 à 40 pixels) ; indéterminé : la détection n'est pas écartée (le modèle a déjà filtré)
  contraste_obligatoire: false
  # Incohérences entre l'écho et la déclaration AIS (IDENTITY_MISMATCH). Longueur : pixel de 10 m, résolution
  # d'environ 20 m en GRD haute résolution, soit deux pixels d'incertitude à chaque bout, plus l'erreur du modèle ;
  # incohérence seulement au delà de 40 m ET de 40 % de la longueur déclarée
  ecart_longueur_m: 40
  ecart_longueur_relatif: 0.4
  longueur_declaree_min_m: 15   # longueurs AIS plus courtes : souvent non renseignées ou fausses
  # Cap : classes de 22,5° (incertitude d'une demi classe), et le radar confond souvent l'avant et l'arrière ; un écart
  # n'est retenu qu'entre 67,5° et 112,5° (navire déclaré en travers de son écho), probabilité de la classe 0,5 au
  # moins, navire faisant route (3 nœuds au moins, cap AIS significatif)
  cap_ecart_min_deg: 67.5
  cap_ecart_max_deg: 112.5
  cap_probabilite_min: 0.5
  cap_vitesse_min_kn: 3
  # Éoliennes : une détection sans AIS à moins de 150 m d'un parc éolien en mer est un écho fixe probable
  eolien_m: 150

# Travailleurs éphémères (mars/travailleurs.py) : instances Scaleway créées à la demande, détruites par le serveur.
# Garde fous : durée de vie, plafonds quotidiens, destruction des orphelins à chaque minute et au redémarrage.
travailleurs:
  zone: fr-par-1
  delai_demarrage_min: 10  # aucun signe de vie (réseau privé joint) au bout de 10 min : destruction
  duree_max_min: 45        # au delà, destruction forcée par le serveur
  max_par_jour: 4          # travailleurs dont une instance a été créée (un lancement refusé avant ne compte pas)
  max_minutes_par_jour: 180
  reserve_viirs:           # place gardée à la nuit VIIRS tant qu'elle n'a pas eu son travailleur du jour
    travailleurs: 1
    minutes: 60            # une heure : DEV1-M facturée à l'heure entamée, une nuit dure 6 à 10 minutes
  facturation_min_min: 60  # instances CPU facturées à l'heure, une heure au moins
  types:
    viirs:
      commercial_type: DEV1-M        # 3 vCPU, 4 Go : 1,45 Go mesurés au plus pour le modèle
      image_label: ubuntu_noble      # Ubuntu 24.04 officielle, disque local ; Docker installé au démarrage
      arch: x86_64
      disque_go: 20
      prix_heure: 0.0202             # euros hors taxes, API Scaleway du 07/10/2026
      image: ghcr.io/allenai/vessel-detection-viirs@sha256:eb5ae0e165add2997d57e786d4efd8f1d969bb27ccd02d0c60ce3ac38bb91198
      script: travailleurs/viirs.py
    sentinel:                        # lot C : détection des navires sur Sentinel 1, GPU NVIDIA L4 (24 Go)
      commercial_type: L4-1-24G      # 8 vCPU, 48 Go ; zones fr-par-1, fr-par-2, pl-waw-2 (catalogue du 11/10/2026)
      zone: fr-par-2                 # GPU surtout disponibles ici ; réseau privé régional, commun à fr-par-1 et 2
      image_label: ubuntu_noble_gpu_os_13_nvidia   # Ubuntu 24.04 GPU OS : pilotes NVIDIA et Docker GPU installés
      volume: sbs_volume             # les L4 n'ont pas de disque local : volume bloc, supprimé explicitement
      arch: x86_64
      disque_go: 60                  # image d'analyse (5 Go compressés, environ 15 installée), scènes, fichiers de travail
      prix_heure: 0.7875             # euros hors taxes, facturé à la minute
      facturation_min_min: 1
      # Image publique d'AI2 (étiquette sha-fafc6c3, commit du 04/01/2024, 5,0 Go compressés en 18 couches, dont
      # 291 Mo pour le code et les poids des modèles), épinglée par empreinte ; script maison qui appelle sa chaîne
      # (prepare_scenes, detect_vessels) : le serveur intégré de l'image est incohérent à cette version
      image: ghcr.io/allenai/vessel-detection-sentinels@sha256:43880082de543afe25770de07f4b5f888f18a368f11bc32b5ecc90ae54fa487e
      script: travailleurs/sentinel.py
      docker_opts: "--gpus all --shm-size=16g"
      # Lot C3 : types de secours, essayés dans l'ordre quand le précédent est en rupture (disponibilité lue avant toute
      # création ; catalogue public de Scaleway du 19/10/2026). Région fr-par seulement : le réseau privé qui ramène
      # les résultats est régional (pl-waw-2, où le L4 était « scarce », est injoignable). Exigences du modèle d'AI2 :
      # PyTorch 1.13.1 compilé pour CUDA 11.7 (architectures sm_37 à sm_86, plus le PTX pour les plus récentes), 16 Go
      # de mémoire GPU suffisent (AI2 l'a réglé sur un T4 de 16 Go). Écartés : H100 (Hopper, sm_90, au delà de CUDA 11.7,
      # 2,87 €/h), les multi GPU (inutiles, une scène à la fois), GPU-3070 (absent du catalogue).
      secours:
        - commercial_type: L4-1-24G    # même GPU, autre zone de la région
          zone: fr-par-1
        - commercial_type: L40S-1-48G  # Ada comme le L4 (sm_89, même chemin CUDA éprouvé le 14/10), 48 Go
          zone: fr-par-2
          prix_heure: 1.4699
        - commercial_type: RENDER-S    # Tesla P100 16 Go (Pascal, sm_60, compilé dans PyTorch 1.13), disque local
          zone: fr-par-2
          volume: l_ssd
          prix_heure: 1.221
      # Repli sur processeur après repli_cpu_apres_h sans GPU (fenêtres seules) : GP1-S, 8 processeurs et 32 Go
      # (modèle et deux fenêtres en mémoire, avec marge), disque local de 300 Go, 0,19 €/h, « available » en fr-par-1 et
      # fr-par-2 le 19/10/2026, quand POP2-8C-32G (0,29 €/h) était « scarce » et demande un volume bloc
      repli_cpu:
        commercial_type: GP1-S
        zone: fr-par-2
        image_label: ubuntu_noble
        volume: l_ssd
        disque_go: 60
        prix_heure: 0.1907
        facturation_min_min: 60
        duree_max_min: 150             # sur processeur, environ 12 min par fenêtre (mesure en émulation) : 45 ne suffit pas
        docker_opts: "--shm-size=16g"
      # Tâche remise par le réseau privé (route etat, {"etat": "tache"}), une seule fois, avec la paire de clés
      # Copernicus dédiée aux travailleurs : Copernicus refuse les adresses présignées (14/10/2026)
      tache_par_le_reseau: true

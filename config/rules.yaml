  # (aucun écho : absent ou parti), non_evaluable
  ajustements:
    viirs: {present_sans_ais: elevee, present_apparie: faible}   # la lumière était un navire AIS
    coupure_ais: {present_sans_ais: elevee}
    rendezvous: {present_sans_ais: elevee}
    identite: {present_sans_ais: elevee}
    watchlist: {present_sans_ais: critique}
  ntfy_gravites: [elevee, critique]   # une notification quand un résultat relève une alerte à ces gravités

# Travailleurs éphémères (mars/travailleurs.py) : instances Scaleway créées à la demande, détruites par le serveur.
# Garde fous : durée de vie, plafonds quotidiens, destruction des orphelins à chaque minute et au redémarrage.
travailleurs:
  zone: fr-par-1
  delai_demarrage_min: 10  # aucun signe de vie (réseau privé joint) au bout de 10 min : destruction
  duree_max_min: 45        # au delà, destruction forcée par le serveur
  max_par_jour: 4          # travailleurs dont une instance a été créée (un lancement refusé avant ne compte pas)
  max_minutes_par_jour: 180
  reserve_viirs:           # place gardée à la nuit VIIRS tant qu'elle n'a pas eu son travailleur du jour
    travailleurs: 1
    minutes: 60            # une heure : DEV1-M facturée à l'heure entamée, une nuit dure 6 à 10 minutes
  # Mode de facturation par type (page des tarifs de Scaleway) : « minute » (GPU L4 et L40S) ou « heure_entamee »
  # (instances CPU DEV1, GP1, POP2, et le RENDER-S : toute heure commencée est due, même pour un échec au démarrage ;
  # essai 26 du 19/10/2026, RENDER-S facturé 1,23 € pour 0,28 € estimés). Utilisé par l'estimation, le budget du mois,
  # le coût réel de chaque travailleur et Grafana
  facturation: heure_entamee
  # Garde de dépense : un type facturé à l'heure entamée et plus cher que 0,50 € de l'heure n'est jamais lancé sans
  # avoir été éprouvé (aucun travailleur abouti sur ce type) ; il faut alors SENTINEL_CALCUL_ESSAI explicite
  prix_max_essai_eur: 0.50
  incompatibilite_jours: 7  # lot C4 : type au GPU inutilisable (nvidia-smi, NVML) jamais essayé pendant 7 jours
  types:
    viirs:
      commercial_type: DEV1-M        # 3 vCPU, 4 Go : 1,45 Go mesurés au plus pour le modèle
      image_label: ubuntu_noble      # Ubuntu 24.04 officielle, disque local ; Docker installé au démarrage
      arch: x86_64
      disque_go: 20
      prix_heure: 0.0202             # euros hors taxes, API Scaleway du 07/10/2026
      image: ghcr.io/allenai/vessel-detection-viirs@sha256:eb5ae0e165add2997d57e786d4efd8f1d969bb27ccd02d0c60ce3ac38bb91198
      script: travailleurs/viirs.py
    sentinel:                        # lot C : détection des navires sur Sentinel 1, GPU NVIDIA L4 (24 Go)
      commercial_type: L4-1-24G      # 8 vCPU, 48 Go ; zones fr-par-1, fr-par-2, pl-waw-2 (catalogue du 11/10/2026)
      zone: fr-par-2                 # GPU surtout disponibles ici ; réseau privé régional, commun à fr-par-1 et 2
      image_label: ubuntu_noble_gpu_os_13_nvidia   # Ubuntu 24.04 GPU OS : pilotes NVIDIA et Docker GPU installés
      volume: sbs_volume             # les L4 n'ont pas de disque local : volume bloc, supprimé explicitement
      arch: x86_64
      disque_go: 60                  # image d'analyse (5 Go compressés, environ 15 installée), scènes, fichiers de travail
      prix_heure: 0.7875             # euros hors taxes
      facturation: minute
      # Image publique d'AI2 (étiquette sha-fafc6c3, commit du 04/01/2024, 5,0 Go compressés en 18 couches, dont
      # 291 Mo pour le code et les poids des modèles), épinglée par empreinte ; script maison qui appelle sa chaîne
      # (prepare_scenes, detect_vessels) : le serveur intégré de l'image est incohérent à cette version
      image: ghcr.io/allenai/vessel-detection-sentinels@sha256:43880082de543afe25770de07f4b5f888f18a368f11bc32b5ecc90ae54fa487e
      script: travailleurs/sentinel.py
      docker_opts: "--gpus all --shm-size=16g"
      # Lot C3 : types de secours, essayés dans l'ordre quand le précédent est en rupture (disponibilité lue avant toute
      # création ; catalogue public de Scaleway du 19/10/2026). Région fr-par seulement : le réseau privé qui ramène
      # les résultats est régional (pl-waw-2, où le L4 était « scarce », est injoignable). Exigences du modèle d'AI2 :
      # PyTorch 1.13.1 compilé pour CUDA 11.7 (architectures sm_37 à sm_86, plus le PTX pour les plus récentes), 16 Go
      # de mémoire GPU suffisent (AI2 l'a réglé sur un T4 de 16 Go). Écartés : H100 (Hopper, sm_90, au delà de CUDA 11.7,
      # 2,87 €/h), les multi GPU (inutiles, une scène à la fois), GPU-3070 (absent du catalogue).
      secours:
        - commercial_type: L4-1-24G    # même GPU, autre zone de la région
          zone: fr-par-1
        - commercial_type: L40S-1-48G  # Ada comme le L4 (sm_89, même chemin CUDA éprouvé le 14/10), 48 Go
          zone: fr-par-2
          prix_heure: 1.4699
        # RENDER-S (Tesla P100, Pascal) retiré le 19/10/2026 après l'essai réel (passage 149, analyse 96, travailleur
        # 26) : docker run --gpus en échec en 5 s, code 125, « failed to initialize NVML: Driver Not Loaded ». L'image
        # « Ubuntu Noble GPU OS 13 » charge les modules noyau ouverts de NVIDIA, qui ne gèrent que Turing et plus
        # récent : aucun Pascal ne peut servir. Pas remplacé (aucun autre GPU compatible dans la région fr-par).
      # Calcul sur processeur (fenêtres seules), dans l'ordre : GP1-S, 8 processeurs et 32 Go (modèle et deux fenêtres
      # en mémoire, avec marge), disque local de 300 Go, 0,19 €/h, « available » en fr-par-1 et fr-par-2 le 19/10/2026 ;
      # POP2-8C-32G (0,29 €/h, volume bloc), en secours si le GP1-S est en rupture. Durée de vie calculée au lancement
      # selon le nombre de fenêtres (section sentinel : minutes_fixes_cpu, minutes_par_fenetre_cpu, cpu_marge_min)
      repli_cpu:
        - commercial_type: GP1-S
          zone: fr-par-2
          image_label: ubuntu_noble
          volume: l_ssd
          disque_go: 60
          prix_heure: 0.1907
          facturation: heure_entamee
          docker_opts: "--shm-size=16g"
        - commercial_type: POP2-8C-32G
          zone: fr-par-2
          image_label: ubuntu_noble
          volume: sbs_volume
          disque_go: 60
          prix_heure: 0.29
          facturation: heure_entamee
          docker_opts: "--shm-size=16g"
      # Tâche remise par le réseau privé (route etat, {"etat": "tache"}), une seule fois, avec la paire de clés
      # Copernicus dédiée aux travailleurs : Copernicus refuse les adresses présignées (14/10/2026)
      tache_par_le_reseau: true
    sentinel2:                       # lot S2 : détection optique Sentinel 2 sur processeur (docs/sentinel2.md)
      commercial_type: GP1-S         # 8 vCPU, 32 Go, disque local : 4,3 Go de mémoire mesurés au plus par fenêtre
      zone: fr-par-2
      image_label: ubuntu_noble
      volume: l_ssd
      arch: x86_64
      disque_go: 80                  # image de 19,8 Go installée, poids de 2,7 Go, fenêtres
      prix_heure: 0.1907
      facturation: heure_entamee
      # Image rslearn d'AI2 (étiquette sentinel2_vessels_v0.0.22, 7,2 Go compressés, Python 3.11, PyTorch 2.7 avec
      # CUDA 12.8), épinglée par empreinte ; poids hors de l'image, remis par adresses présignées du seau des modèles
      image: ghcr.io/allenai/sentinel2-vessel-detection@sha256:0ce4cbee15337138ead556f41aa099eb0512ae4b1bc4b3d4d6773ba90aa3672c
      script: travailleurs/sentinel2.py
      docker_opts: "--shm-size=16g"  # 64 Mo par défaut : le chargeur de données de l'inférence meurt
      repli_cpu:
        - commercial_type: POP2-8C-32G
          zone: fr-par-2
          image_label: ubuntu_noble
          volume: sbs_volume
          disque_go: 80
          prix_heure: 0.29
          facturation: heure_entamee
      # Tâche remise par le réseau privé, avec la paire Copernicus des travailleurs et les adresses des poids
      tache_par_le_reseau: true

# Lot P, panneau de contrôle (21/10/2026). L'état du panneau est en base et prime sur ce fichier (interrupteurs des
# analyses satellites, plafonds, modes des règles, préférences de notification, zones de vigilance) : ne plus modifier
# ce fichier sur le serveur pour suspendre quoi que ce soit. Les seuils ne s'éditent jamais dans l'interface : le
# panneau ne choisit qu'entre les valeurs et profils définis ici.
controle:
  # Plafond quotidien de scènes réglable dans le panneau, dans ces bornes (valeur par défaut : celle des sections
  # sentinel et sentinel2 ci dessus)
  plafonds:
    sentinel1: {min: 0, max: 4}
    sentinel2: {min: 0, max: 4}
  session_h: 12                 # durée d'une session d'opérateur
  rayon_demande_m: {min: 1000, max: 30000, defaut: 5000}   # demande d'observation manuelle du panneau
  # Phase C : règles d'alerte pilotées par le panneau. Mode actif (alertes), observation (épisodes comptés dans
  # task_runs et episodes_observes, aucune alerte) ou coupé (rien). Le mode en base prime sur celui du fichier
  # (ais_gap.mode compris) ; un changement de mode ne supprime aucune alerte. section : seuils affichés en lecture seule.
  regles:
    ais_gap: {nom: Coupure AIS, section: ais_gap}
    rendezvous: {nom: Rendez vous, section: rendezvous}
    identite:
      nom: Changement d'identité
      section: identite
      sous_types: {nom: Changement de nom, omi: Même OMI sous un autre MMSI}
    watchlist: {nom: Navire des listes, section: watchlist}
    viirs: {nom: Détections VIIRS, section: viirs}
    sentinel1:
      nom: Sentinel 1
      section: sentinel
      sous_types: {dark_ship: Navire sans AIS, ais_unconfirmed: Position non confirmée, identity_mismatch: Identité incohérente}
    sentinel2:
      nom: Sentinel 2
      section: sentinel2
      sous_types: {dark_ship: Navire sans AIS, ais_unconfirmed: Position non confirmée, identity_mismatch: Identité incohérente}
  # Phase D : préférences de notification par défaut ; le panneau les remplace en base (notif:preferences). Les
  # heures calmes (heure de Paris) retiennent tout sauf les pannes graves (disque plein, collecte figée, ingestion), avec
  # un résumé au réveil. Appliqué aux envois de taches et aux règles de Grafana (fonction SQL notification_permise).
  notifications:
    alertes:
      gravite_min: elevee        # nouvelle alerte notifiée à partir de cette gravité
      types: {AIS_GAP: true, RENDEZVOUS: true, IDENTITY_CHANGE: true, WATCHLIST: true, DARK_SHIP: true,
              AIS_UNCONFIRMED: false, IDENTITY_MISMATCH: true}
    tip_and_cue: true            # résultat de tip and cue qui relève une alerte
    categories: {pannes: true, disque: true, collecte: true, travailleurs: true}
    heures_calmes: {actif: true, debut: "23:00", fin: "07:00"}
    par_minute_max: 5            # nouvelles alertes : au delà, un seul message de synthèse
  # Phase E : priorité aux navires suivis (réglage oui ou non du panneau) : demandes d'observation d'un navire suivi
  # relevées de priorite_plus dans tip and cue, donc servies d'abord par la sélection Sentinel
  suivis:
    priorite_plus: 1

# Zones de vigilance (lot P, phase E) : dessinées dans le panneau de contrôle, un profil choisi parmi ceux ci. Les
# valeurs restent ici ; une zone ne fait qu'abaisser un seuil (jamais le relever), relever une gravité ou une priorité.
# Seuils réglables par zone : rendezvous.min_duration_min, ais_gap.min_gap_min.
zones_vigilance:
  tampon_m: {min: 500, max: 20000, defaut: 3704}     # tampon autour d'une infrastructure (2 milles par défaut)
  profils:
    renforce:
      nom: Renforcé
      gravite_min: moyenne      # alerte dans la zone : gravité moyenne au moins
      priorite_plus: 2          # tip and cue : demande dans la zone relevée de 2
      priorite_sentinel: 5      # sélection Sentinel : point d'intérêt de la zone classé comme une demande de priorité 5
      seuils: {rendezvous.min_duration_min: 60, ais_gap.min_gap_min: 60}
    attention:
      nom: Attention
      priorite_plus: 1
      priorite_sentinel: 3
      seuils: {}

# Dossiers (lot U, refonte de l'interface, docs/ux_refonte.md, section 8) : un dossier par navire ou par point réunit
# ses alertes ouvertes ; niveau de suspicion à trois niveaux (À noter, À examiner, Urgent), chaque contribution
# listée ; phrase d'explication par gabarits. Le moteur des alertes ne change pas : ces réglages ne servent qu'à
# l'affichage et au tri. Validés par Antoine le 21/10/2026.
dossiers:
  fenetre_h: 72                 # alertes dont l'instant est dans les 72 h précédant l'instant affiché
  infrastructure_m: 1852        # « près d'un câble » : à 1 mille au plus
  en_mer_m: 2000                # navire des listes « en mer » : à plus de 2 km de la côte
  transit_kn: 3                 # au delà, il est en transit (À noter même près d'une infrastructure) ; 2026.10.42
  point_fusion_m: 2000          # deux points sans navire fusionnés à moins de 2 km
  point_fusion_h: 6             # et de 6 heures
  # Séjour prolongé « À examiner » seulement si la part du séjour à l'arrêt hors port l'atteint (2026.10.43) : sur le
  # serveur, 30 jours au 21/10, transits et escales à quai à 0, NOSTOS à 0,09, SAFEEN BARONESS à 0,33, SMYRTOS à 1
  sejour_hors_port_part: 0.2
  # Base selon la gravité la plus haute ; navire des listes seul : À noter, À examiner en mer près d'une
  # infrastructure ou en séjour prolongé surtout à l'arrêt hors port (watchlist.sejour_prolonge_h)
  base: {critique: 3, elevee: 2, moyenne: 1, faible: 1}


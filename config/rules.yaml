  tips:                         # priorité : la plus haute passe d'abord dans le plafond quotidien ; actif: false coupe
    operateur: {actif: true, priorite: 6}
    coupure_ais:                # coupure de gravité élevée près d'une infrastructure ; règle en observation : la
      actif: true               # demande porte le motif « coupure observée », aucune alerte de coupure n'est créée
      priorite: 5
      gravite_min: elevee
      corridor_m: 3704
      types_exclus: [30]        # pêche (type AIS 30) : coupures fréquentes, sans rapport avec les infrastructures
      exclure_declassees: true  # coupure déclassée en sortie de couverture (point de disparition collectif) : écartée
    viirs:                      # DARK_SHIP de source VIIRS ; au delà de 12 h entre la lumière et le passage, un navire
      actif: true               # sombre qui fait route est parti : passage écarté avec son motif
      priorite: 4
      gravite_min: moyenne
      delai_max_h: 12
    rendezvous: {actif: true, priorite: 4, cote_min_km: 5}       # rendez vous au large
    watchlist:                  # navire des listes en mer près d'une infrastructure : remplacerait, actif, le point
      actif: false              # « navire des listes dans un corridor » de la sélection (rejeu : surtout des transits)
      priorite: 3
      corridor_m: 3704
    identite: {actif: true, priorite: 2, gravite_min: moyenne}   # IDENTITY_CHANGE
  # Gravité de l'alerte d'origine selon le résultat (relevée ou abaissée, jamais retirée). Résultats : present_apparie

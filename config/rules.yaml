# Tip and cue (lot T1, mars/tip_and_cue.py, docs/tip_and_cue.md) : un signal suspect (le tip) crée une demande
# d'observation (le cue). Position prédite au prochain passage Sentinel 1 qui la couvre (ou à un passage acquis dans
# les dernières heures), fenêtres de 24 km analysées dans la session Sentinel du passage (mêmes plafonds, même budget),
# résultat ajouté comme preuve à l'alerte d'origine. Jamais de retrait automatique d'une alerte.
tip_and_cue:
  # Activé le 20/10/2026 après le rejeu sur le serveur (7 jours : 73 tips, 17 avec passage, délai médian 8,6 h) ;
  # watchlist coupé : la sélection directe des navires des listes dans un corridor reste en place
  actif: true
  intervalle_min: 5             # tips relevés et demandes planifiées toutes les 5 minutes (après les règles)
  fenetre_tips_h: 6             # alertes créées ou mises à jour depuis 6 h
  expiration_h: 36              # demande expirée 36 h après sa création sans passage utile
  heures_retro: 6               # passage déjà acquis dans les 6 dernières heures : analyse immédiate
  regroupement_m: 10000         # tips sans navire (VIIRS, point de la carte) à moins de 10 km : une seule demande
  fenetres_max_par_demande: 4   # au delà (incertitude trop grande au passage), demande « sans_passage »
  # Centre à moins de sentinel.point_cote_min_km (2 km) de la côte : « sans_passage », invisible au radar
  prediction:                   # estime à partir du dernier cap et de la dernière vitesse AIS
    # Cercle appris et garde de probabilité (2026.10.45, docs/trajectoire.md section 12). Quantiles de l'erreur de
    # l'estime (m) aux niveaux « niveaux », par tranche de vitesse déclarée (bornes basses) et par horizon de 1 à 30 h ;
    # la vérité est la position où le navire réapparaît, même après un silence. Le rayon est le quantile à
    # « contenance » (80 %), plafonné au rayon que couvrent les fenêtres permises (20 km pour 4) ; la contenance
    # estimée du cercle retenu (fonction de répartition interpolée) est notée dans la demande, et un passage n'est
    # retenu que si elle atteint « contenance_min » (le plus proche au dessus du seuil). Valeurs PROVISOIRES du
    # 22/10/2026 (échantillon de 340 navires lus sur le serveur, hors pêche, 7 193 fenêtres avant le 17/10) ; à
    # remplacer par la mesure complète (taches.py trajectoire-mesures --cercle-seul).
    cercle_appris:
      contenance: 0.8
      contenance_min: 0.4
      plafonner: true
      vitesses_kn: [1, 5, 10, 15]
      horizons_h: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 18, 21, 24, 27, 30]

# Collecteur OpenTelemetry de MARS C2 (étape D2) : reçoit les traces de tout le système en OTLP par HTTP, filtre les
# données sensibles, échantillonne, et les confie à Tempo. Distribution contrib : tail_sampling (garder les requêtes
# lentes ou en erreur, décision prise une fois la trace complète), transform (filtre des données sensibles) et
# file_storage (file d'attente sur disque) n'existent pas dans la distribution de base (docs/opentelemetry.md).
#
# Entrées : services du serveur par le réseau Docker (http://otel:4318) et 127.0.0.1:4318 sur l'hôte ; Grafana en
# gRPC (otel:4317, réseau Docker seulement) ; interface
# web par nginx (port 8080, /otel/v1/traces) ; travailleurs par nginx sur le réseau privé (port 8090, jeton vérifié
# par l'API). Le collecteur n'écoute jamais sur une adresse publique.
# Échantillonnage (seuils dans ce seul fichier) : tâches, collecte, ingestion et travailleurs à 100 % ; requêtes de
# l'API et de l'interface : erreurs et traces de plus de 1 s gardées, 10 % du reste.

extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    timeout: 10s
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      # gRPC : Grafana seulement (son traceur n'exporte qu'en gRPC), sur le réseau Docker ; port non publié
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304          # 4 Mo : un lot d'un travailleur, jamais plus
        cors:
          allowed_origins: ["http://localhost:8080", "http://127.0.0.1:8080"]

processors:
  # Premier processeur : au delà de 120 Mo (sur 200 de la limite Docker, dont la part du binaire chargé), le
  # collecteur refuse les nouveaux lots (l'émetteur réessaie) au lieu d'être tué ; un refus déclenche l'alerte
  # « collecteur saturé ». Mesure du 19/10/2026 : 158 Mo au plus sous une rafale d'une journée de spans en 5 s.
  memory_limiter:
    check_interval: 1s
    limit_mib: 120
    spike_limit_mib: 30

  # Données sensibles, seconde barrière après le filtre du code (mars/traces.py, travailleurs/otel_mini.py) : clés,
  # jetons, mots de passe, adresses signées, chaînes de requête, sujet ntfy. Testé par scripts/verifier_images.sh traces.
  transform/sensible:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - delete_matching_keys(attributes, "(?i).*(authorization|cookie|token|jeton|secret|password|passwd|mot_de_passe|api_?key|access_?key|credential|signature|sujet).*")
      - context: span
        statements:
          - delete_matching_keys(attributes, "(?i).*(authorization|cookie|token|jeton|secret|password|passwd|mot_de_passe|api_?key|access_?key|credential|signature|sujet).*")
          - delete_key(attributes, "url.query")
          - replace_pattern(attributes["url.full"], "[?#].*$", "")
          - replace_pattern(attributes["http.url"], "[?#].*$", "")
          - replace_pattern(attributes["http.target"], "[?#].*$", "")
          - replace_pattern(attributes["url.full"], "^(https?://[^/]*ntfy[^/]*)/.*$", "$$1/…")
          - replace_all_patterns(attributes, "value", "(?i)(bearer|basic) [A-Za-z0-9._~+/=-]+", "$$1 ***")
          - replace_all_patterns(attributes, "value", "(?i)(x-amz-[a-z-]+|awsaccesskeyid|signature|token|jeton|api_?key|sig)=[^&\\s\"']+", "$$1=***")
      - context: spanevent
        statements:
          - delete_matching_keys(attributes, "(?i).*(authorization|cookie|token|jeton|secret|password|passwd|mot_de_passe|api_?key|access_?key|credential|signature|sujet).*")
          - replace_all_patterns(attributes, "value", "(?i)(bearer|basic) [A-Za-z0-9._~+/=-]+", "$$1 ***")
          - replace_all_patterns(attributes, "value", "(?i)(x-amz-[a-z-]+|awsaccesskeyid|signature|token|jeton|api_?key|sig)=[^&\\s\"']+", "$$1=***")
          - replace_all_patterns(attributes, "value", "(?i)(https?://[^?#\\s\"']+)[?#][^\\s\"']*", "$$1")

  # Échantillonnage sur la trace complète (attente de 15 s après son premier span). Les décisions sont gardées en
  # mémoire : les spans d'un travailleur qui arrivent vingt minutes après le lancement rejoignent la même trace.
  tail_sampling:
    decision_wait: 15s
    num_traces: 5000
    expected_new_traces_per_sec: 20
    decision_cache:
      sampled_cache_size: 50000
      non_sampled_cache_size: 50000
    policies:
      - name: taches_et_travailleurs
        type: string_attribute
        string_attribute:
          key: service.name
          values: [mars-taches, mars-collecte, mars-ingestion, mars-travailleur]
      - name: erreurs
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: lentes
        type: latency
        latency: { threshold_ms: 1000 }
      - name: reste_api
        type: probabilistic
        probabilistic: { sampling_percentage: 10 }

  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  # File d'attente sur disque : si Tempo redémarre, les lots attendent (jusqu'à 2 h de nouvelles tentatives)
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 2000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 2h

service:
  extensions: [file_storage, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/sensible, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
  telemetry:
    logs:
      level: warn
    # Mesures du collecteur (spans reçus, refusés, envoyés, file d'attente), lues chaque minute par taches et
    # consignées en base (mesures_otel) : Grafana les lit sans Prometheus
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
